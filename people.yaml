# Who can read what.
#
# Identities only. Tokens live in .people-tokens.json, which is gitignored and
# generated by:
#
#     python tools\make_people_tokens.py
#
# `key` is what you write in a secret block's audience list:
#
#     :::secret dm, wren
#     Only The DM and Wren can read this.
#     :::
#
# The special audience `dm` matches anyone whose role is dm, so you can address
# the DM without naming them.
#
# Anyone connecting with the old shared token (.mcp-token) is treated as a
# guest: they see every public page and no secrets at all.

people:
  - key: dm
    name: The DM
    role: dm

  - key: tobias
    name: Tobias Goreguts
    role: player
    character: Tobias Goreguts

  - key: timothy
    name: Timothy Tuttle
    role: player
    character: Timothy Tuttle

  - key: korran
    name: Korran Mossborn
    role: player
    character: Korran Mossborn

  - key: wren
    name: Wren
    role: player
    character: Wren

  - key: aelan
    name: Aelan Viremont
    role: player
    character: Aelan Viremont
